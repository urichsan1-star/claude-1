<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Frasco y caja de Grahams natural Pro 20+">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
